<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IoT Radar LDR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, Arial;
        margin: 20px;
      }
      .row {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      canvas {
        background: #0b1020;
        border-radius: 12px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
        min-width: 300px;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
      }
      .ok {
        background: #e6ffed;
        color: #036a2c;
      }
    </style>
  </head>
  <body>
    <h2>Monitoring LDR + Servo</h2>

    <div class="row">
      <div class="card">
        <canvas id="radar" width="400" height="400"></canvas>
      </div>

      <div class="card">
        <h3>Kontrol</h3>
        <form id="frm">
          <label
            >Mode Servo:
            <select name="servo_mode" id="servo_mode">
              <option value="auto">auto</option>
              <option value="manual">manual</option>
            </select>
          </label>
          <label
            >Target Sudut (0–180):
            <input
              type="number"
              name="servo_target"
              id="servo_target"
              min="0"
              max="180"
              value="90"
            />
          </label>
          <label
            >Yellow Logic:
            <select name="yellow_logic" id="yellow_logic">
              <option value="gelap_singkat">gelap_singkat</option>
              <option value="terang_singkat">terang_singkat</option>
            </select>
          </label>
          <label
            >RED Hold (ms):
            <input
              type="number"
              name="red_hold_ms"
              id="red_hold_ms"
              value="1500"
            />
          </label>
          <button type="submit">Simpan</button>
        </form>
        <div id="msg" class="pill ok" style="display: none; margin-top: 8px">
          Tersimpan
        </div>
      </div>
    </div>

    <script>
      const cv = document.getElementById("radar");
      const ctx = cv.getContext("2d");
      const C = { cx: cv.width / 2, cy: cv.height / 2, r: cv.width / 2 - 18 };

      function drawFrame() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        // grid
        ctx.strokeStyle = "#20304a";
        [0.25, 0.5, 0.75, 1].forEach((f) => {
          ctx.beginPath();
          ctx.arc(C.cx, C.cy, C.r * f, 0, 2 * Math.PI);
          ctx.stroke();
        });
      }

      async function fetchData() {
        const r = await fetch("/api/ldr/latest?n=180");
        const data = await r.json();
        drawFrame();
        // plot: hijau terang, merah gelap
        data.forEach((row) => {
          const ang = ((row.angle_deg || 0) * Math.PI) / 180;
          const rr = C.r * 0.95;
          const x = C.cx + rr * Math.cos(ang);
          const y = C.cy - rr * Math.sin(ang);
          ctx.beginPath();
          ctx.fillStyle = row.ldr_state ? "#ff5252" : "#29d398";
          ctx.arc(x, y, 4, 0, 2 * Math.PI);
          ctx.fill();
        });
      }

      async function loadSettings() {
        const s = await (await fetch("/api/settings")).json();
        ["servo_mode", "servo_target", "yellow_logic", "red_hold_ms"].forEach(
          (k) => {
            const el = document.getElementById(k);
            if (el) el.value = s[k];
          }
        );
      }

      document.getElementById("frm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          const msg = document.getElementById("msg");
          msg.style.display = "inline-block";
          setTimeout(() => (msg.style.display = "none"), 1200);
        }
      });

      setInterval(fetchData, 1000);
      loadSettings();
      fetchData();
    </script>
  </body>
</html>
